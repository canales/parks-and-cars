<style>
:root{
  --paper:#F6F7F5; --ink:#1D2321; --muted:#5E6763; --rule:#DADFDC;
  --forest:#2F5D3A; --canopy:#D5E4CF; --canopy-edge:#9DBF94;
  --hw:#303336; --main:#565B60; --local:#80868B; --service:#AAB0B4; --roads:#565B60;
  --marking:#E0B72E; --focus:#E0B72E; --highlight:#EEF2EC; --sel:#E3EBDF;
  --warn-bg:#FBF3D9; --warn-ink:#6B5712;
  --p1:#C2DAB6; --p2:#A3C895; --p3:#DDE9D7; --cyc-sep:#0B5CA8; --cyc-edge:#FFFFFF; --hw-edge:#8D9298;
  --spd1:#2F7D4A; --spd2:#D4A21E; --spd3:#D9822B; --spd4:#C0392B; --spdx:#B9BEC1;
  --mwc:#6E7773; --cb1:#08306B; --cb2:#2F7FC1; --cb3:#6FA8D8; --cbx:#D9DEDB;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141816; --ink:#E4E9E6; --muted:#9BA5A0; --rule:#2C3430;
    --forest:#8CC19A; --canopy:#20362A; --canopy-edge:#3E6A4B;
    --hw:#E3E6E8; --main:#BFC4C8; --local:#979DA2; --service:#71777C; --roads:#BFC4C8;
    --marking:#E8C547; --focus:#E8C547; --highlight:#1B211E; --sel:#22302A;
    --warn-bg:#2E2912; --warn-ink:#E9D58B;
    --p1:#274634; --p2:#325A43; --p3:#1C2E24; --cyc-sep:#6FB3F0; --cyc-edge:#141816; --hw-edge:#7B8187;
  --spd1:#6FC08A; --spd2:#E8C547; --spd3:#F0A05A; --spd4:#F06A5A; --spdx:#4A5250;
  --mwc:#8E9893; --cb1:#9BCBF7; --cb2:#5A9FDF; --cb3:#2F6DA8; --cbx:#3A423E;
  }
}
:root[data-theme="dark"]{
  --paper:#141816; --ink:#E4E9E6; --muted:#9BA5A0; --rule:#2C3430;
  --forest:#8CC19A; --canopy:#20362A; --canopy-edge:#3E6A4B;
  --hw:#E3E6E8; --main:#BFC4C8; --local:#979DA2; --service:#71777C; --roads:#BFC4C8;
  --marking:#E8C547; --focus:#E8C547; --highlight:#1B211E; --sel:#22302A;
  --warn-bg:#2E2912; --warn-ink:#E9D58B;
  --p1:#274634; --p2:#325A43; --p3:#1C2E24; --cyc-sep:#6FB3F0; --cyc-edge:#141816; --hw-edge:#7B8187;
  --spd1:#6FC08A; --spd2:#E8C547; --spd3:#F0A05A; --spd4:#F06A5A; --spdx:#4A5250;
  --mwc:#8E9893; --cb1:#9BCBF7; --cb2:#5A9FDF; --cb3:#2F6DA8; --cbx:#3A423E;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--text);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:2px}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule)}
.nav-links{display:flex;gap:22px;flex-wrap:wrap;font-weight:500}
.nav-links a{text-decoration:none;color:var(--muted);padding:4px 0}
.nav-links a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--forest)}
.nav-links a:hover{color:var(--ink)}
.nav-links a.brand{font:700 22px/1 var(--display);color:var(--ink);box-shadow:none;letter-spacing:.01em}
.nav-right{display:flex;align-items:center;gap:16px}
.nav-right .ext{font-size:14px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
.nav-right .ext:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.lang button{font:500 14px var(--text);background:none;border:0;color:var(--muted);padding:5px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hero{--hero-fig:clamp(340px,38vw,520px);display:grid;grid-template-columns:minmax(0,1fr) var(--hero-fig);gap:36px;align-items:stretch;padding:18px 0 10px}   /* --hero-fig sets the map size */
.hero h1{font:700 clamp(30px,3.75vw,54px)/1.02 var(--display);letter-spacing:-.01em;margin:0 0 8px;max-width:26ch}
.lede{font-size:17px;line-height:1.45;color:var(--muted);max-width:84ch;margin:0 0 12px}
.hero-text{display:flex;flex-direction:column}
.hero-text .facts{flex:1;justify-content:center}      /* the bullet group sits centred in the space beside the map */
@media (min-width:901px){.hero-text .facts{gap:26px}}      /* 26px: halfway between the old 7px and the stretched 46px */
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.facts li{font-size:17px;line-height:1.35;padding-left:16px;position:relative}
.facts li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;background:var(--hw)}
.facts li:nth-child(1)::before{background:var(--forest)}
.facts strong{font:600 1.15em/1 var(--display);letter-spacing:.01em}
.facts a{color:var(--forest);font-weight:600;text-decoration:none;border-bottom:1px solid var(--forest);white-space:nowrap}
.hero-fig{margin:0}
.hero-fig figcaption{font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:6px}
.hero-fig .vtog{margin:0 0 8px}
.hero-fig .legend{display:none}
#ranking{scroll-margin-top:10px}
.sq{position:relative;background:var(--canopy);border:1px solid var(--canopy-edge);aspect-ratio:1/1;width:100%}
.sq-car{position:absolute;left:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;min-width:2px;min-height:2px;transition:width .35s ease,height .35s ease}
.sq-car span{display:block}
.sq-tag{position:absolute;right:12px;top:10px;font:600 15px var(--display);color:var(--forest)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;display:inline-block;flex:none}
.legend i.ln{height:4px;width:18px}
.legend i.dot{border-radius:50%;width:11px;height:11px}
.prelim{border-left:3px solid var(--marking);color:var(--warn-ink);font-size:13px;line-height:1.4;padding:2px 10px;margin:14px 0 0;max-width:84ch}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:4px;border:0;margin:0;padding:0}
.chips legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chip{font:500 13px var(--text);padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--paper)}
.check{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--forest)}
.sort{display:flex;align-items:center;gap:8px;font-size:14px}
.sort select{font:500 14px var(--text);padding:4px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;padding:14px 0 40px;align-items:start}
.list h2,.detail h2,.method h2{font:600 26px/1.15 var(--display);margin:0 0 14px}
.list h2{margin:0;font-size:22px}
.listhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px}
.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 84px minmax(120px,.8fr);gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:7px 8px;font:inherit;color:inherit;cursor:pointer}
.row:hover{background:var(--highlight)}
.row[aria-pressed="true"]{background:var(--sel)}
.row.home .pname{font-weight:600}
.rank{color:var(--muted);font-size:15px}
.pname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcity{display:block;font-size:14px;color:var(--muted)}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.pmeta .pills{margin-top:0}
.k1{--c:var(--spd1)}.k2{--c:var(--spd2)}.k3{--c:var(--spd3)}.k4{--c:var(--spd4)}.kx{--c:var(--spdx)}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--c);flex:none}
.sp{stroke:var(--c)}
.spdsub{font:600 14px var(--text);margin:14px 0 2px}
.rkl{list-style:none;margin:0 0 6px;padding:0}
.rkl li{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:8px 0 8px 16px;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.35}
.rkl li::before{content:"";position:absolute;left:0;top:1.05em;width:7px;height:7px;background:var(--forest)}
.rkl li:last-child{border-bottom:0}
.rkl small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.rkl .rv{text-align:right;flex:none}
.rkl .rv b{font:600 21px/1.1 var(--display)}
.rkl .rv b span{font:400 13px var(--text);color:var(--muted)}
.dual{display:flex;gap:2px;height:8px;margin-top:5px;min-width:150px}
.dual i{display:block;height:100%;border-radius:2px;background:var(--c)}
.barcap{font-size:13px;color:var(--muted);margin:2px 0 0}
.bar2{display:flex;gap:2px;height:22px;margin:6px 0 8px}
.bar2 i{display:flex;align-items:center;justify-content:center;height:100%;border-radius:2px;font:700 12px var(--text);font-style:normal;color:var(--on,#fff);overflow:hidden;white-space:nowrap}
.hatch{background:repeating-linear-gradient(135deg,var(--mwc) 0 3px,transparent 3px 7px)!important;box-shadow:inset 0 0 0 1px var(--mwc)}
.blist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:3px 14px;font-size:13px;color:var(--muted)}
.blist li{display:flex;align-items:center;gap:6px}
.blist b{color:var(--ink);font-weight:600}
.blist em{font-style:normal}
.blist .cyc-sw{width:24px;height:8px}
.rt{border-collapse:collapse;margin:0 0 14px;font-size:14px}
.rt th,.rt td{border-bottom:1px solid var(--rule);padding:4px 18px 4px 0;text-align:left}
.rt th{color:var(--muted);font-weight:500}
.spdtop{display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 4px}
.spdtop .msign{margin:0;flex:none}
.spdcta{margin:6px 0 4px;font-size:13px}
.spdcta a{color:var(--forest);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.spdmapkey{margin:10px 0 0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--highlight)}
.spdmapkey .legend{margin:0 0 6px}
.spdmapkey .spdcta{margin:2px 0 0}
.bm-btn:disabled{opacity:.45;cursor:not-allowed}
.s-unsafe{background:var(--spd4);color:var(--paper)}
.s-mixed{background:var(--spd2);color:#1D2321}
.s-safe{background:var(--spd1);color:var(--paper)}
.s-few{box-shadow:inset 0 0 0 1px var(--rule);color:var(--muted)}
.more-facts{display:none;margin:8px 0 0}
.controls{display:block}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fmenu{position:relative}
.fbtn{display:flex;align-items:center;gap:6px;font:500 13.5px var(--text);padding:4px 12px;border-radius:999px;border:1px solid var(--rule);background:none;color:var(--ink);cursor:pointer}
.fbtn .fl{color:var(--muted)}
.fbtn b{font-weight:600}
.fbtn i{font-style:normal;font-size:11px;color:var(--muted)}
.fbtn[data-on="1"]{border-color:var(--forest);background:var(--canopy)}
.fbtn[aria-expanded="true"]{box-shadow:0 0 0 2px var(--focus)}
.fpop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:240px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.fpop[hidden]{display:none}
.fpop h5{margin:8px 8px 3px;font:600 12px var(--text);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fpop h5:first-child{margin-top:2px}
.fopt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:400 14.5px var(--text);padding:6px 8px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer}
.fopt:hover{background:var(--highlight)}
.fopt[aria-checked="true"]{font-weight:600}
.fopt .mk{width:14px;color:var(--forest)}
.fopt small{margin-left:auto;color:var(--muted);font-size:12.5px;padding-left:12px}
.factive{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 0;font-size:13px;color:var(--muted)}
.factive[hidden]{display:none}
.achip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--forest);background:var(--canopy);color:var(--ink);border-radius:999px;padding:1px 3px 1px 10px;font:500 13px var(--text)}
.achip button{border:0;background:none;font-size:16px;line-height:1;padding:0 6px;cursor:pointer;color:var(--muted)}
.factive .clear{border:0;background:none;font:500 13px var(--text);color:var(--forest);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0 4px}
.fback{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.4)}
.fback[hidden]{display:none}
@media (min-width:561px){.fback{display:none!important}}
.km{--c:var(--mwc)}
.m-reset{position:absolute;right:10px;bottom:26px;z-index:4;font:500 12.5px var(--text);padding:4px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.mpop{position:absolute;z-index:7;width:max-content;max-width:min(290px,88%);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px 30px 10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.22);font-size:13.5px;line-height:1.4}
.mpop h4{margin:0 0 1px;font:600 17px/1.2 var(--display)}
.mpop .ptype{color:var(--muted);margin:0 0 6px}
.mpop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.mpop dt{color:var(--muted)}.mpop dd{margin:0;display:flex;align-items:center;gap:6px}
.mpop .x{position:absolute;top:3px;right:5px;border:0;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}
.hit{cursor:default}
.pick-halo,.pick-line{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.pick-halo{stroke:var(--paper);stroke-opacity:.9;stroke-width:9}
.pick-line{stroke:var(--ink);stroke-opacity:.8;stroke-width:3.5}
.mpop::after{content:"";position:absolute;left:var(--ax,50%);bottom:-8px;width:15px;height:15px;margin-left:-7.5px;background:var(--paper);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:rotate(45deg)}
.mpop.below::after{bottom:auto;top:-8px;border:0;border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.mpop hr{border:0;border-top:1px solid var(--rule);margin:8px 0}
.mpop a{color:var(--forest);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px;display:inline-block;margin-top:8px}
.parea{font-size:15px;color:var(--muted);text-align:right}
.share{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;background:var(--highlight);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--hw);transition:width .35s ease}
.pct{min-width:78px;text-align:right;font:600 17px var(--display)}
.colhead{display:grid;grid-template-columns:28px minmax(0,1fr) 84px minmax(120px,.8fr);gap:12px;padding:0 8px 6px;font-size:13px;color:var(--muted)}
.colhead span:nth-child(3){text-align:right}
.empty{padding:28px 8px;color:var(--muted)}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.dsub{color:var(--muted);margin:-8px 0 16px}
.dsq{max-width:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;margin:20px 0}
.msign{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px #C62828;color:#1D2321;font:700 11px var(--text);margin-left:8px;vertical-align:3px;cursor:help}
.search{font:400 14px var(--text);padding:4px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--ink);min-width:190px}
.method h3{font:600 21px/1.2 var(--display);margin:26px 0 8px}
.labels{margin:4px 0 14px;padding:0;list-style:none}
.labels li{margin:0 0 8px}
.labels .pill{margin-right:8px}
.stat dt{font-size:13px;color:var(--muted)}
.stat dd{margin:0;font:600 24px/1.1 var(--display)}
.stat dd small{font:400 14px var(--text);color:var(--muted)}
.breakdown{margin:0 0 14px;padding:0;list-style:none}
.breakdown li{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:15px;padding:5px 0;border-bottom:1px solid var(--rule)}
.breakdown i{width:12px;height:12px}
.breakdown b{font:600 16px var(--display)}
.breakdown em{font-style:normal;color:var(--muted);font-size:14px}
.dnote{font-size:14px;color:var(--muted);margin:0}
.vs{font-size:14px;color:var(--muted);margin:0 0 6px}
.story-link{display:inline-block;margin-top:14px;font-weight:600;color:var(--forest)}

/* the Monsanto story */
.story{border:1px solid var(--rule);border-radius:10px;margin:0 0 48px;background:var(--paper)}
.story>summary{list-style:none;cursor:pointer;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.story>summary::-webkit-details-marker{display:none}
.story>summary h2{font:700 clamp(26px,3.4vw,38px)/1 var(--display);margin:0 0 6px}
.story>summary p{margin:0;color:var(--muted)}
.story>summary .toggle{font:600 15px var(--text);color:var(--forest);white-space:nowrap}
.story[open]>summary{border-bottom:1px solid var(--rule)}
.story-body{padding:8px 24px 32px}
.story-note{background:var(--warn-bg);color:var(--warn-ink);font-size:14px;padding:8px 12px;border-radius:6px;margin:16px 0 0}
.chapter{padding:28px 0 8px;border-bottom:1px solid var(--rule)}

.seg button[aria-pressed="true"]{background:var(--forest);color:var(--paper)}
.maphint{font-size:13px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.35;max-width:240px;box-shadow:0 2px 10px rgba(0,0,0,.12);display:none;z-index:2}

.m-park{fill:var(--canopy);stroke:var(--canopy-edge);stroke-width:1}
.cx{stroke:var(--paper);cursor:pointer}
.sign circle{fill:#FFFFFF;stroke:#C62828;stroke-width:2.4}
.sign text{font:700 9px var(--text);fill:#1D2321;text-anchor:middle}
.plabel text{font:600 15px var(--display);fill:var(--forest);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:3px;pointer-events:none}
.vtog{margin:0 0 12px;width:max-content}
.dmap{margin:0}

  .tbl th:nth-child(4),.tbl td:nth-child(4){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const SITE = __SITE__;
const INLINE_MAPS = __MAPS__;
const MAPS_URL = "__MAPS_URL__";
const INLINE_SPEED = __SPEED__;
const SPEED_URL = "__SPEED_URL__";
const HOME = SITE.home;
const HOME_MOTORWAY = ["A 5", "Duarte Pacheco"];   // the motorway the story is about
const PT_NAMES = {"201-sintra-sintra-cascais-natural-park": "Parque Natural de Sintra-Cascais"};
function spdStats(s){        // average pedestrian risk at the posted limit, only where enough limits are mapped to compare
  if(!s || s.rated == null) return null;
  const R = (SITE.rules && SITE.rules.speed) || {min_cover: 25, min_km: 3, risk_safe_below: 10, risk_unsafe_from: 34};
  const cover = s.rated ? 100 * s.mapped / s.rated : 0;
  const gated = cover >= R.min_cover && s.mapped >= R.min_km;
  const risk = gated ? s.risk / s.mapped : null;
  const safe = gated ? 100 * s.b1 / s.mapped : null;
  const grp = !gated ? "few" : (risk < R.risk_safe_below ? "safe" : (risk >= R.risk_unsafe_from ? "unsafe" : "mixed"));
  return {cover, gated, risk, safe, above: gated ? 100 - safe : null, grp};
}
const PARKS = SITE.parks.map(r => {
  const split = Object.fromEntries(Object.entries(r.cat_km2).map(([k, v]) => [k, (v || 0) * 1e6]));
  return {...r,
    name: r.id === HOME ? {en:"Monsanto Forest Park", pt:"Parque Florestal de Monsanto"}
        : (PT_NAMES[r.id] ? {en: r.name, pt: PT_NAMES[r.id]} : r.name),
    city: r.id === HOME ? {en:"Lisbon", pt:"Lisboa"} : r.city,
    roadKm: r.road_km, split, spdc: spdStats(r.spd),
    roadM2: split.highways + split.main + split.local + split.service, parkingM2: split.parking};
});
const mapCache = {};
function getMap(id){
  if(INLINE_MAPS[id]) return Promise.resolve(INLINE_MAPS[id]);
  if(!MAPS_URL) return Promise.resolve(null);
  if(!(id in mapCache)) mapCache[id] = fetch(MAPS_URL + id + ".json").then(r => r.ok ? r.json() : null).catch(() => null);
  return mapCache[id];
}
const speedCache = {};
function getSpeed(id){      // road lines coloured by speed limit, loaded when the layer is switched on
  if(INLINE_SPEED[id]) return Promise.resolve(INLINE_SPEED[id]);
  if(!SPEED_URL) return Promise.resolve(null);
  if(!(id in speedCache)) speedCache[id] = fetch(SPEED_URL + id + ".json").then(r => r.ok ? r.json() : null).catch(() => null);
  return speedCache[id];
}
const LINKS = {
  guide: "https://www.globalroadsafetyfacility.org/publications/guide-safe-speeds-managing-traffic-speeds-save-lives-and-improve-livability",
  who: "https://cdn.who.int/media/docs/default-source/documents/health-topics/road-traffic-injuries/3146-wbk-speed-mgmt-2nd-edition-131023-electronic.pdf",
  hussain: "https://www.sciencedirect.com/science/article/abs/pii/S0001457519301058",
  stockholm: "https://urban-mobility-observatory.transport.ec.europa.eu/news-events/news/stockholm-declaration-wants-general-30-kmh-speed-limit-2020-03-12_en"
};
const FIELD_M2 = 105 * 68;
const REGIONS = ["all","eu","na","sa","as","af","oc"];
const CAT_ORDER = ["highways","main","local","service","parking"];
const CYC_DASH = {separated: null, shared: "9 3 2 3", painted: "4 4"};   // one blue; the line style carries the type
const CYC_W = 3;
const CYC_VAR = {separated: "--cb1", shared: "--cb2", painted: "--cb3"};   // option D: three blues
function cycSwatch(cls){
  const d = CYC_DASH[cls];
  return `<svg class="cyc-sw" viewBox="0 0 30 10" aria-hidden="true"><rect width="30" height="10" rx="2" fill="var(--canopy)"/>`
    + `<line x1="2" y1="5" x2="28" y2="5" stroke="var(--cyc-edge)" stroke-width="${CYC_W + 3}" stroke-linecap="round"/>`
    + `<line x1="2" y1="5" x2="28" y2="5" stroke="var(${CYC_VAR[cls]})" stroke-width="${CYC_W}"${d ? ` stroke-dasharray="${d}"` : ""}/></svg>`;
}
const CAT_VAR = {highways:"--hw", main:"--main", local:"--local", service:"--service", roads:"--roads", parking:"--marking"};
const BANDS = [["b30","--s30"],["b50","--s50"],["b70","--s70"],["b90","--s90"],["b91","--s91"],["none","--snone"]];
const BAND_VAR = Object.fromEntries(BANDS);

const T = {
en:{
  nav_map:"Portugal illegal parking map ↗", nav_parks:"Urban parks and cars", nav_story:"The Monsanto story", nav_method:"Methodology",
  title:"How much of the world's great urban parks goes to cars?",
  lede:n=>`We measured roads and parking as a share of land inside ${n} of the largest urban parks with the same method, using OpenStreetMap. Lisbon's Monsanto is near the top, and there are calls to remove parts of a new bike lane.`,
  fact_share:p=>`<strong>${p}</strong> of Monsanto is roads and parking.`,
  fact_area:a=>`That is <strong>${a}</strong> of asphalt and parking.`,
  fact_hw:"More than half of it is highways cutting through the park.",
  square_caption:"The green square is Monsanto. The grey corner is all its roads and parking, gathered together at true scale.",

  story_title:"The Monsanto story: a forest crossed by 106 km of road",
  story_sub:"What the roads do to Lisbon's forest, what other cities did, and what Lisbon can do now.",
  story_open:"Open the story", story_close:"Close the story",
  s1_h:"Lisbon is arguing about a cycle ring. The real question is bigger.",
  s1_p:"Lisbon is debating whether to remove the new ring that lets people cross Monsanto on foot and by bike. But the question isn't what a painted lane takes from cars. It's what cars already take from Lisbon's only forest.",
  s2_h:"How much of Monsanto belongs to cars",
  s3_h:"A forest cut in two",
  opt_pieces:"Pieces of forest", opt_speed:"Speed limits", opt_unmarked:"Unmarked junctions (to check)",
  map_hint:"Scroll or pinch to zoom, drag to move. More speed limits appear as you zoom in. Tap a dot to see what it crosses.",
  s4_h:"Who lives there, and what the roads do to them",
  s4_p1:"Monsanto is home to wild rabbits, field mice, shrews, moles, red squirrels, hedgehogs, mongooses, genets and foxes, and to snakes, frogs, terrapins and salamanders that in Lisbon live only in its forests and parks. It also has 65 resident bird species.",
  s4_p2:"Roads harm animals in three ways: they kill them, they shrink their habitat, and they split populations into smaller groups that are more likely to disappear.",
  s4_p3:"Monsanto has its own evidence. Between 1997 and 2001, 213 squirrels were killed on the park's roads, most of all on Estrada do Barcal, Estrada de Monsanto, Estrada da Serafina and Estrada 24 de Janeiro: local roads, not the motorway. The motorway did something different: squirrels were introduced north of it in 1993, and it held back their spread through the park. The internal roads kill, and the highways wall the forest off.",
  s5_h:"Other cities already did it",
  s5_p:"None of these cities are famous for cycling, and most are in countries far more dependent on the car than Portugal.",
  c1_w:"Madrid, 17.2 km²", c1_p:"Madrid cut the last through-route across its forest park, a shortcut to the M-30 used by about 5,000 vehicles a day. Outside rush hour, the city noted, it didn't even save drivers time. Today the park is open to people all year and closed to private through traffic, with access kept to its zoo, amusement park and lake.",
  c2_w:"Washington, D.C.", c2_p:"Beach Drive has had car-free Sundays since 1966. In 2020 about 6 km of it closed to cars every day, and in 2022 the Park Service made that permanent. Its assessment found minimal effect on nearby traffic, and the road is the only paved, accessible route through that part of the park.",
  c3_w:"San Francisco", c3_p:"Car-free on Sundays since 1967, every day since 2020, and permanently since 2022, with around 55 improvements to make the park easier to reach for older and disabled people. San Francisco's voters confirmed it in November 2022.",
  c4_w:"New York", c4_p:"Closed to cars on Sundays from 1966 and on Saturdays from 1967, then bit by bit on weekdays, until every drive became car-free in June 2018. It gets more than 42 million visits a year.",
  c5_w:"Brooklyn, New York", c5_p:"Car-free weekends since 1967. A car-free summer trial in 2017, when people walking, running and cycling outnumbered cars three to one at the morning peak, led to closing the loop for good in January 2018.",
  c6_w:"Toronto", c6_p:"Car-free on weekends and holidays since 2020. In 2023 the city council voted 18 to 7 to keep it that way, closed 1.7 km of roads to cars every day, and made closing the whole park to cars its long-term goal, after consulting more than 10,000 people.",
  s5_lesson:"<strong>Start with weekends, and organise them.</strong> Central Park, Prospect Park and Golden Gate Park all began with car-free Sundays or weekends in the 1960s. A car-free day only works if someone brings families in, with activities, markets and guided walks, and counting who comes turns opinion into evidence, as Prospect Park's summer trial did.",
  c1_src:"Read more: <a href='https://diario.madrid.es/blog/notas-de-prensa/la-casa-de-campo-mas-protegida/'>Madrid city council</a> · <a href='https://www.esmadrid.com/node/69388'>esMadrid</a>",
  c2_src:"Read more: <a href='https://dcist.com/story/22/11/02/dc-beach-drive-stays-car-free-all-year'>DCist</a> · <a href='https://planetizen.com/node/119733'>Planetizen</a>",
  c3_src:"Read more: <a href='https://sfrecpark.org/1538/accessGGP'>San Francisco Rec and Park</a> · <a href='https://spur.org/sf-prop-j-preserve-jfk-promenade-recreational-space'>SPUR</a>",
  c4_src:"Read more: <a href='https://www.nyc.gov/office-of-the-mayor/news/206-18/mayor-de-blasio-central-park-world-s-most-iconic-greenspace-will-become-permanently'>City of New York</a>",
  c5_src:"Read more: <a href='https://www.nyc.gov/office-of-the-mayor/news/001-18/mayor-de-blasio-prospect-park-now-completely-car-free-starting-today'>City of New York</a>",
  c6_src:"Read more: <a href='https://www.toronto.ca/news/toronto-city-council-endorses-phased-improvements-to-how-people-move-around-and-access-high-park/'>City of Toronto</a> · <a href='https://postcity.com/?p=128182'>Post City</a>",
  s6_h:"Why it matters beyond Monsanto",
  w1_h:"Asphalt sends Monsanto's rain downhill",
  w1_p:"A review of 92 studies on urban forests found that trees protect against runoff better than any other urban land use: their canopy catches rain and their soil soaks it up. Asphalt does the opposite. Lisbon is paying for that difference: it is building a 5 km drainage tunnel from Monsanto to Santa Apolónia, part of a €250 million plan, to catch the water that gathers on the city's high ground, Monsanto included, and carry it to the river before it floods the valleys below. Every square metre of road inside Monsanto is rain that runs off instead of soaking in, on the very high ground that tunnel was built to drain.",
  w2_h:"Speed kills people",
  w2_p:"A review of 20 studies found that a pedestrian hit at 30 km/h has about a 5% risk of dying, rising to 29% at 50 km/h and 90% at 80 km/h. The World Health Organization's speed-management manual puts it simply: people on foot or on a bike can usually survive a crash only up to 30 km/h. Monsanto's roads are shared with runners, walkers, families and cyclists, yet most of the limits mapped there allow more.",
  w3_h:"Forests cool cities",
  w3_p:"Asphalt and missing trees make cities hotter than the land around them. A study in The Lancet of 93 European cities estimated that this heat-island effect causes over 4% of summer deaths, and that a third of them could be prevented by raising tree cover to 30%. The benefit is greatest in southern Europe, where summers are hottest and trees fewest. Lisbon is already planting for this, with some 240,000 plants in the EU-funded LIFE LUNGS project. Every square metre of asphalt in Monsanto is shade that isn't there.",
  w1_src:"Sources: <a href='https://www.nature.com/articles/s41598-023-28629-6'>Scientific Reports (2023), review of 92 studies on urban forests</a> · <a href='https://lisboaparapessoas.pt/wp-content/uploads/2022/05/pgdl_brochura.pdf'>Lisbon city council, Plano Geral de Drenagem</a> · <a href='https://www.dn.pt/sociedade/moedas-anuncia-concluso-do-segundo-tnel-do-plano-de-drenagem-de-lisboa-em-2029'>Diário de Notícias</a>", w2_src:"Sources: <a href='https://www.sciencedirect.com/science/article/abs/pii/S0001457519301058'>Hussain et al. (2019), Accident Analysis &amp; Prevention</a> · <a href='https://cdn.who.int/media/docs/default-source/documents/health-topics/road-traffic-injuries/3146-wbk-speed-mgmt-2nd-edition-131023-electronic.pdf?sfvrsn=696ed45e_3'>World Health Organization, Speed management manual</a>", w3_src:"Sources: <a href='https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(22)02585-5/abstract'>Iungman et al. (2023), The Lancet</a> · <a href='https://www.isglobal.org/en/-/4-of-summer-mortality-is-attributable-to-urban-heat-islands'>ISGlobal summary</a> · <a href='https://climate-adapt.eea.europa.eu/en/metadata/publications/urban-greening-cools-cities-and-saves-lives'>European Environment Agency, Climate-ADAPT</a> · <a href='https://climate.ec.europa.eu/news-other-reads/news/adapting-when-climate-crisis-hits-close-home-2023-08-01_en'>European Commission, LIFE LUNGS in Lisbon</a>",
  s7_h:"What Lisbon can do now",
  s7_p:"<strong>The timing is exceptional.</strong> Portugal sent its draft National Nature Restoration Plan to the European Commission on 28 August 2026, and has until August 2027 to finalise it. <strong>It's the law:</strong> by the end of 2030 there can be no net loss of urban green space and tree canopy compared to 2024, and from 2031 both must grow. <strong>There's money:</strong> the plan foresees €500 million a year for restoration until 2030. <strong>It's the city's decision:</strong> Monsanto belongs to Lisbon's city council, while the A5 is run by Brisa.",
  s7_steps:"Five steps, each possible without the next:",
  s7_1:"<strong>Keep the cycle ring.</strong> Don't undo something that just started.",
  s7_2:"<strong>Car-free Sundays on the internal roads</strong>, organised for families, and counted.",
  s7_3:"<strong>Close the internal roads where animals die</strong> to private cars, keeping access for services, emergencies and people with reduced mobility.",
  s7_4:"<strong>Put Monsanto in the final national plan</strong>, with the closed roads turned back into forest.",
  s7_5:"<strong>More crossings over the A5</strong>, for people and for animals, agreed with Brisa and the government.",
  s7_link:"How we measured",

  d_cyc_na:"Cycling infrastructure hasn't been measured for this park yet.",
  m_cyc:"Cycling infrastructure follows the definitions of the <a href='https://european-cyclists-federation.github.io/Documents/Methodology.pdf'>European Cyclists' Federation (QECIO 2.1)</a>: cycle paths and tracks separated from traffic, paths shared by people cycling and walking, and painted cycle lanes. We leave out sharrows, bus lanes and advisory lanes that cars may drive in; ECF counts advisory lanes as cycle lanes, which is the one difference from its method. As in ECF's method, one-way infrastructure counts half its length. We compare cycling with roads, as km of cycling per 100 km of road, for parks with at least {min} km of road. Most cycle paths in parks run away from roads, so a park can have more km of cycling than of road. Zero means none mapped in OpenStreetMap.",

  cyc_story3:(nh,nl)=>` Among the ${nh} car-heavy parks we measured, Monsanto is one of ${nl} that give little of that space back to bikes.`,
  m_groups:(lo,hi,sh)=>`Parks are grouped by the share of their land given to roads and parking: mostly car-free (under ${lo}%), some car infrastructure (${lo} to ${hi}%) and car-heavy (${hi}% or more). Parks with car infrastructure also get a cycling tag, and parks with enough speed limits mapped also get a speed group. For cycling: bikes get a share when there are at least ${sh} km of cycling infrastructure for every 100 km of road, and little for bikes below that. Mostly car-free parks get no cycling tag: with barely any road, there is little for cycling to make up for, and mountain-bike trails are often not mapped as cycling infrastructure.`,

  mh_cyc:"Cycling", mh_groups:"Groups and labels", mh_limits:"What the data can and can't tell",
  m_pieces:"Pieces are what remains of a park after taking out its highways: the parts of the forest that highways cut off from each other. Tunnels and viaducts of 100 m or more don't cut the park, since there is open ground over or under them. Pieces smaller than 1 hectare, such as medians and the inside of ramps, are ignored.",
  m_speed_ps:sp=>[
    `The <b>vulnerable user risk rating</b> shows how dangerous a park's posted speed limits would be for vulnerable users, meaning people on foot or bike, who are hit by a car. It uses <b>legal speed limits</b>, from the maxspeed tag in OpenStreetMap (miles per hour are converted), not actual operational speeds. Many roads have none mapped.`,
    `<b>Which roads.</b> Every road is included except motorways and their slip roads (OpenStreetMap's motorway and motorway_link). The <a href="${LINKS.guide}">Guide for Safe Speeds</a> (World Bank and WRI, 2024) defines a motorway as an access-controlled road with no intersections or traffic lights, where vulnerable users are prohibited, so there is no risk to them to assess there. Trunk roads and all others stay in, because they can have intersections and crossings. We infer access control from the road type, not from checking barriers on the ground. Motorways are left out of the speed bar and of the rating, and each park's panel says how many km that is.`,
    `<b>Why "vulnerable users".</b> The <a href="${LINKS.who}">WHO speed management manual</a> says pedestrians and cyclists alike can typically survive impact speeds only up to about 30 km/h, and the Guide for Safe Speeds suggests applying the limits that protect pedestrians to cyclists and motorcyclists until more specific evidence exists. For the same reason we apply one risk curve to all vulnerable users: the published figures come from studies of people on foot, the group with the most data, and there is no separate published curve for cyclists.`,
    `<b>The risk figure.</b> For each road with a mapped limit we take the risk of fatality for a vulnerable user hit by a car at that speed, from the 2019 meta-analysis of 20 studies by <a href="${LINKS.hussain}">Hussain and colleagues</a>, which the WHO manual (2023) cites. We assume traffic moves at each road's posted limit, read the risk from the published points below and join them with straight lines. Under 30 km/h we use 5% and above 80 km/h we use 90%, the highest value reported, so the risk of the fastest limits is understated. A park's figure is the average over its roads with a mapped limit, weighted by road length, and its rank is among the rated parks.`,
    "RISKTABLE",
    `<b>Speed bands and "safe speed".</b> The bands in the bar (30, 50 and 70 km/h) are the Safe System survivable speeds in Table 1 of both the WHO manual and the Guide for Safe Speeds: 30 km/h where cars and vulnerable users can meet, 50 km/h where side impacts are possible, 70 km/h for head-on crashes. A "safe speed" is 30 km/h or 20 mph or less, which the 2020 <a href="${LINKS.stockholm}">Stockholm Declaration</a> also calls for where vulnerable users mix with vehicles.`,
    `<b>When a park is rated, and the groups.</b> A park is rated when at least ${sp.min_cover}% of its road length (motorways aside), and at least ${sp.min_km} km, has a speed limit mapped. Until then its panel says "Not rated yet" and it carries the "Few limits mapped" label. Rated parks are grouped by their risk figure: under ${sp.risk_safe_below}% is "Mostly safe speeds" (the published risk at 37 km/h), ${sp.risk_safe_below}% to ${sp.risk_unsafe_from}% is "Mixed speeds", and ${sp.risk_unsafe_from}% or more is "Heavy on unsafe speeds" (the risk of a road posted at 50 km/h, the Safe System limit where side impacts are possible).`,
    `<b>Where limits are missing you can help.</b> The Speed limits layer on each park's map shows which roads have no limit mapped. Click one and a link opens the OpenStreetMap editor right at that road, with street-level photos and traffic signs switched on.`
  ],

  m_title:"How we measured",
  m_body:[
    "Parks come from <a href='https://en.wikipedia.org/wiki/List_of_urban_parks_by_size'>Wikipedia's list of urban parks by size</a>, which covers urban parks of about 4 km² or more around the world. We measured every park on it except {skipped} that have no Wikipedia article of their own or no single boundary in OpenStreetMap. <a href='#parklist'>The full list is below</a>. Each park's boundary is its polygon in OpenStreetMap.",
    "Roads are every OpenStreetMap road open to cars inside that boundary, in four groups: highways (motorways, trunk roads and their ramps), main roads, local roads and service roads. Highways always count: a motorway crossing a park takes forest just as a road inside it does. Footpaths, cycle paths, dirt tracks, parking aisles and private roads are left out.",
    "Each road's surface is its length times its width. When OpenStreetMap has the road's width (between 2 and 40 m), we use it. Otherwise the width is its number of lanes times a lane width (3.75 m on motorways and trunk roads, 3.5 m on primary and secondary roads, 3 m on all others), plus shoulders (4 m per carriageway on motorways, 3 m on trunk roads, 3.5 m on motorway and trunk ramps, 1 m on primary and secondary roads, 0.5 m on tertiary roads, none on the rest). When the number of lanes isn't mapped either, we assume 2 per carriageway on motorways and trunk roads (4 if mapped as a single two-way road), 1 on ramps, living streets and service roads, and 2 on all other roads. A motorway with 3 lanes each way is therefore about 15 m of asphalt per direction. Overlaps at junctions count once, tunnels count as zero, and medians are not counted.",
    "Parking is every car park mapped as an area inside the park. The share is roads plus parking, divided by the park's area. ",
    "A crossing is a place where a footpath, or another road, crosses a highway inside the park by a bridge, a tunnel or a marked crossing. Both carriageways of a motorway count as one crossing. Junctions where roads meet a highway ramp at the same level, with no crossing mapped, are shown separately for checking.",
    "Each park's boundary was checked against the map. Its area can differ from Wikipedia's figure, usually because Wikipedia includes lakes or the sea, while we measure the park's land.",
    "These are estimates. OpenStreetMap is more complete in some cities than others, and most local road widths come from typical values rather than measurements."
  ],
  footer:"Data © OpenStreetMap contributors (ODbL) and Wikipedia's list of urban parks by size.",
  locale:"en-GB"
},

  lede:n=>`Medimos as estradas e o estacionamento como parte do território de ${n} dos maiores parques urbanos, com o mesmo método e dados do OpenStreetMap. Monsanto, em Lisboa, está perto do topo, e há quem queira retirar partes de uma nova ciclovia.`,

  story_title:"A história de Monsanto: uma floresta atravessada por 106 km de estrada",
  story_sub:"O que as estradas fazem à floresta de Lisboa, o que outras cidades fizeram, e o que Lisboa pode fazer agora.",
  story_open:"Abrir a história", story_close:"Fechar a história",
  s1_h:"Lisboa discute um anel ciclável. A verdadeira questão é maior.",
  s1_p:"Lisboa discute se deve retirar o novo anel que permite atravessar Monsanto a pé e de bicicleta. Mas a questão não é o que uma faixa pintada tira aos carros. É o que os carros já tiram à única floresta de Lisboa.",
  s2_h:"Quanto de Monsanto pertence aos carros",
  s3_h:"Uma floresta cortada em duas",
  opt_pieces:"Pedaços de floresta", opt_speed:"Limites de velocidade", opt_unmarked:"Cruzamentos sem travessia (a verificar)",
  map_hint:"Use a roda do rato ou dois dedos para aproximar e arraste para mover. Aparecem mais limites de velocidade à medida que aproxima. Toque num ponto para ver o que atravessa.",
  s4_h:"Quem lá vive, e o que as estradas lhe fazem",
  s4_p1:"Monsanto é casa de coelhos-bravos, ratos-do-campo, musaranhos, toupeiras, esquilos-vermelhos, ouriços-cacheiros, sacarrabos, ginetas e raposas, e de cobras, rãs, cágados e salamandras que, em Lisboa, só vivem nas suas florestas e parques. Tem também 65 espécies de aves residentes.",
  s4_p2:"As estradas fazem mal aos animais de três formas: matam-nos, reduzem o seu habitat e dividem as populações em grupos mais pequenos, com maior risco de desaparecer.",
  s4_p3:"Monsanto tem provas próprias. Entre 1997 e 2001 morreram 213 esquilos nas estradas do parque, sobretudo na Estrada do Barcal, na Estrada de Monsanto, na Estrada da Serafina e na Estrada 24 de Janeiro: estradas locais, não a autoestrada. A autoestrada fez outra coisa: os esquilos foram introduzidos a norte dela em 1993, e ela travou a sua expansão pelo parque. As estradas interiores matam, e as autoestradas fecham a floresta.",
  s5_h:"Outras cidades já o fizeram",
  s5_p:"Nenhuma destas cidades é famosa pela bicicleta, e a maioria fica em países muito mais dependentes do carro do que Portugal.",
  c1_w:"Madrid, 17,2 km²", c1_p:"Madrid cortou o último atravessamento do seu parque florestal, um atalho para a M-30 usado por cerca de 5000 veículos por dia. Fora da hora de ponta, notou a câmara, nem sequer poupava tempo. Hoje o parque está aberto às pessoas todo o ano e fechado ao trânsito particular de atravessamento, mantendo o acesso ao zoo, ao parque de diversões e ao lago.",
  c2_w:"Washington, D.C.", c2_p:"A Beach Drive tem domingos sem carros desde 1966. Em 2020, cerca de 6 km fecharam aos carros todos os dias, e em 2022 o Serviço Nacional de Parques tornou isso permanente. A sua avaliação concluiu que o efeito no trânsito vizinho era mínimo, e a estrada é o único percurso pavimentado e acessível nessa parte do parque.",
  c3_w:"São Francisco", c3_p:"Sem carros aos domingos desde 1967, todos os dias desde 2020, e de forma permanente desde 2022, com cerca de 55 melhorias para facilitar o acesso de pessoas idosas e com deficiência. Os eleitores de São Francisco confirmaram-no em novembro de 2022.",
  c4_w:"Nova Iorque", c4_p:"Fechado aos carros aos domingos desde 1966 e aos sábados desde 1967, depois pouco a pouco durante a semana, até todas as vias ficarem sem carros em junho de 2018. Recebe mais de 42 milhões de visitas por ano.",
  c5_w:"Brooklyn, Nova Iorque", c5_p:"Fins de semana sem carros desde 1967. Um verão experimental sem carros em 2017, em que quem andava a pé, corria ou pedalava superou os carros três para um na hora de ponta da manhã, levou ao fecho definitivo do circuito em janeiro de 2018.",
  c6_w:"Toronto", c6_p:"Sem carros aos fins de semana e feriados desde 2020. Em 2023 a câmara votou 18 contra 7 para manter assim, fechou 1,7 km de estradas aos carros todos os dias e fez do fecho de todo o parque aos carros o seu objetivo de longo prazo, depois de consultar mais de 10 000 pessoas.",
  s5_lesson:"<strong>Começar pelos fins de semana, e organizá-los.</strong> O Central Park, o Prospect Park e o Golden Gate Park começaram todos com domingos ou fins de semana sem carros nos anos 60. Um dia sem carros só resulta se alguém trouxer as famílias, com atividades, mercados e visitas guiadas, e contar quem vem transforma opiniões em provas, como fez o verão experimental do Prospect Park.",
  c1_src:"Saber mais: <a href='https://diario.madrid.es/blog/notas-de-prensa/la-casa-de-campo-mas-protegida/'>Madrid city council</a> · <a href='https://www.esmadrid.com/node/69388'>esMadrid</a>",
  c2_src:"Saber mais: <a href='https://dcist.com/story/22/11/02/dc-beach-drive-stays-car-free-all-year'>DCist</a> · <a href='https://planetizen.com/node/119733'>Planetizen</a>",
  c3_src:"Saber mais: <a href='https://sfrecpark.org/1538/accessGGP'>San Francisco Rec and Park</a> · <a href='https://spur.org/sf-prop-j-preserve-jfk-promenade-recreational-space'>SPUR</a>",
  c4_src:"Saber mais: <a href='https://www.nyc.gov/office-of-the-mayor/news/206-18/mayor-de-blasio-central-park-world-s-most-iconic-greenspace-will-become-permanently'>City of New York</a>",
  c5_src:"Saber mais: <a href='https://www.nyc.gov/office-of-the-mayor/news/001-18/mayor-de-blasio-prospect-park-now-completely-car-free-starting-today'>City of New York</a>",
  c6_src:"Saber mais: <a href='https://www.toronto.ca/news/toronto-city-council-endorses-phased-improvements-to-how-people-move-around-and-access-high-park/'>City of Toronto</a> · <a href='https://postcity.com/?p=128182'>Post City</a>",
  s6_h:"Porque é que isto importa para além de Monsanto",
  w1_h:"O asfalto manda a chuva de Monsanto por encosta abaixo",
  w1_p:"Uma revisão de 92 estudos sobre florestas urbanas concluiu que as árvores protegem contra o escoamento melhor do que qualquer outro uso do solo urbano: a copa retém a chuva e o solo absorve-a. O asfalto faz o contrário. Lisboa está a pagar essa diferença: está a construir um túnel de drenagem de 5 km entre Monsanto e Santa Apolónia, parte de um plano de 250 milhões de euros, para captar a água que se junta nos pontos altos da cidade, Monsanto incluído, e levá-la ao rio antes que inunde os vales. Cada metro quadrado de estrada dentro de Monsanto é chuva que escorre em vez de se infiltrar, precisamente no ponto alto que esse túnel foi construído para drenar.",
  w2_h:"A velocidade mata pessoas",
  w2_p:"Uma revisão de 20 estudos concluiu que um peão atropelado a 30 km/h tem cerca de 5% de risco de morrer, que sobe para 29% a 50 km/h e 90% a 80 km/h. O manual de gestão da velocidade da Organização Mundial da Saúde resume: quem anda a pé ou de bicicleta normalmente só sobrevive a um embate até 30 km/h. As estradas de Monsanto são partilhadas com quem corre, caminha, pedala e com famílias, mas a maioria dos limites lá mapeados permite mais.",
  w3_h:"As florestas arrefecem as cidades",
  w3_p:"O asfalto e a falta de árvores tornam as cidades mais quentes do que o território à sua volta. Um estudo publicado na The Lancet sobre 93 cidades europeias estimou que este efeito de ilha de calor causa mais de 4% das mortes no verão, e que um terço delas poderia ser evitado com 30% de cobertura arbórea. O benefício é maior no sul da Europa, onde os verões são mais quentes e há menos árvores. Lisboa já está a plantar para isto, com cerca de 240 000 plantas no projeto LIFE LUNGS, financiado pela UE. Cada metro quadrado de asfalto em Monsanto é sombra que não existe.",
  w1_src:"Fontes: <a href='https://www.nature.com/articles/s41598-023-28629-6'>Scientific Reports (2023), review of 92 studies on urban forests</a> · <a href='https://lisboaparapessoas.pt/wp-content/uploads/2022/05/pgdl_brochura.pdf'>Lisbon city council, Plano Geral de Drenagem</a> · <a href='https://www.dn.pt/sociedade/moedas-anuncia-concluso-do-segundo-tnel-do-plano-de-drenagem-de-lisboa-em-2029'>Diário de Notícias</a>", w2_src:"Fontes: <a href='https://www.sciencedirect.com/science/article/abs/pii/S0001457519301058'>Hussain et al. (2019), Accident Analysis &amp; Prevention</a> · <a href='https://cdn.who.int/media/docs/default-source/documents/health-topics/road-traffic-injuries/3146-wbk-speed-mgmt-2nd-edition-131023-electronic.pdf?sfvrsn=696ed45e_3'>World Health Organization, Speed management manual</a>", w3_src:"Fontes: <a href='https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(22)02585-5/abstract'>Iungman et al. (2023), The Lancet</a> · <a href='https://www.isglobal.org/en/-/4-of-summer-mortality-is-attributable-to-urban-heat-islands'>ISGlobal summary</a> · <a href='https://climate-adapt.eea.europa.eu/en/metadata/publications/urban-greening-cools-cities-and-saves-lives'>European Environment Agency, Climate-ADAPT</a> · <a href='https://climate.ec.europa.eu/news-other-reads/news/adapting-when-climate-crisis-hits-close-home-2023-08-01_en'>European Commission, LIFE LUNGS in Lisbon</a>",
  s7_h:"O que Lisboa pode fazer agora",
  s7_p:"<strong>O momento é excecional.</strong> Portugal enviou o seu projeto de Plano Nacional de Restauro da Natureza à Comissão Europeia a 28 de agosto de 2026, e tem até agosto de 2027 para o concluir. <strong>É a lei:</strong> até ao fim de 2030 não pode haver perda líquida de espaços verdes urbanos nem de copa de árvores face a 2024, e a partir de 2031 ambos têm de aumentar. <strong>Há dinheiro:</strong> o plano prevê 500 milhões de euros por ano para restauro até 2030. <strong>A decisão é da cidade:</strong> Monsanto pertence à Câmara Municipal de Lisboa, e a A5 é gerida pela Brisa.",
  s7_steps:"Cinco passos, cada um possível sem o seguinte:",
  s7_1:"<strong>Manter o anel ciclável.</strong> Não desfazer algo que acabou de começar.",
  s7_2:"<strong>Domingos sem carros nas estradas interiores</strong>, organizados para as famílias, e contados.",
  s7_3:"<strong>Fechar aos carros particulares as estradas interiores onde morrem animais</strong>, mantendo o acesso a serviços, emergências e pessoas com mobilidade reduzida.",
  s7_4:"<strong>Incluir Monsanto no plano nacional final</strong>, com as estradas fechadas devolvidas à floresta.",
  s7_5:"<strong>Mais travessias sobre a A5</strong>, para pessoas e para animais, acordadas com a Brisa e o Governo.",
  s7_link:"Como medimos",
  hook:(a,c,p)=>`Monsanto tem ${a} km². Destes, ${c} km² são asfalto e estacionamento: ${p}% da floresta já está pavimentada.`,
  scale:(km,hw,n,r,src)=>`Dentro de Monsanto há ${km} km de estrada, mais ou menos a distância de Lisboa a Setúbal, ida e volta. Só as autoestradas e vias rápidas ocupam ${hw}% do parque, mais do que todas as estradas interiores e o estacionamento juntos. Entre os ${n} grandes parques urbanos que medimos, ${src} (<a href='#parklist'>ver a lista completa</a>), Monsanto é o ${r} com maior parte do seu território dada aos carros.`,
  ord:r=>`${r}.º`,
  tbl_len:"Comprimento", tbl_surf:"Área", tbl_share:"Parte do parque", tbl_total:"Total",
  cross:(p1,p2,small,km,n,detail)=>`A autoestrada A5 divide Monsanto em dois: um pedaço de ${p1} km² e outro de ${p2} km², além de ${small} pedaços pequenos cortados nas margens. ${km ? `Ao longo dos seus ${km} km dentro do parque, há` : "Dentro do parque há"} apenas ${n} sítios para atravessar a A5 a pé: ${detail}. Em qualquer outro ponto, atravessar significa passar 30 a 38 m de asfalto, mais o separador central.`,
  cross_how:(o,u)=>[o ? `${o} ${o === 1 ? "passagem superior pedonal" : "passagens superiores pedonais"}` : "", u ? `${u} ${u === 1 ? "passagem inferior" : "passagens inferiores"}` : ""].filter(Boolean).join(" e "),
  cross_via:(p,r)=>[p ? `${p} por ${p === 1 ? "um caminho pedonal" : "caminhos pedonais"}` : "", r ? `${r} por ${r === 1 ? "uma estrada" : "estradas"}` : ""].filter(Boolean).join(" e "),
  k_halves:"as duas metades em que a A5 corta Monsanto", k_n:"sítios para atravessar a A5 a pé",
  k_per:x=>`1 a cada ${x} km`, k_perl:"da A5 dentro do parque",
  speed:(mapped,total,above,share)=>`Os limites de velocidade só estão mapeados em ${mapped} dos ${total} km de estrada de Monsanto. Em ${above} km desses (${share}%), os carros podem andar a mais de 30 km/h, a velocidade acima da qual um atropelamento se torna muito mais provavelmente mortal.`,
  hero_cap_sq:"Monsanto a verde. Todas as suas estradas e estacionamento, à escala real, a cinzento.",
  hero_cap_map:"Estradas na largura real, limites de velocidade, estacionamento e ciclovias. Mantenha Ctrl ou ⌘ e use a roda para ampliar.",
  d_hw:"Autoestradas no interior", bm:"Mapa de fundo", bm_blocked:"O mapa de fundo não carrega nesta pré-visualização. Vai carregar no site publicado.",
  col_size:"Área do parque", col_density:"Km de estrada por km²",
  list_h:n=>`Os ${n} parques que medimos`, list_city:"Cidade, país",
  list_hint:"Ordenados por país e depois por nome do parque. Clique numa coluna para ordenar por ela.",
  footer_map:"Do mesmo projeto: o mapa do estacionamento ilegal em Portugal.",
  credit:"Criado por <a href='https://www.linkedin.com/in/diegocanales/'>Diego Canales</a> · <a href='https://github.com/canales/parks-and-cars'>Ver no GitHub ↗</a>",
  cyc_story:(road,ded,sep)=>`Para ${road} km de estrada, Monsanto tem ${ded} km de infraestrutura ciclável dedicada, ${sep} km dos quais segregados do trânsito.`,
  cyc_btn:"Ciclovias", s_cycling:"Ciclovia por 100 km de estrada", col_cycling:"Ciclovia por 100 km de estrada",
  lg_cyc_sep:"Ciclovia segregada", lg_cyc_shared:"Partilhada com peões", lg_cyc_painted:"Faixa ciclável pintada",
  d_cyc_h:"Para onde vão os ciclistas", d_cyc_sep:"Segregada do trânsito", d_cyc_shared:"Partilhada com peões",
  d_cyc_painted:"Faixas pintadas", d_cyc_total:"Total",
  d_cyc_per:x=>`${x} km de infraestrutura ciclável por km de estrada.`,
  d_cyc_ecf:x=>`Rácio ECF: <b>${x}%</b>`,
  d_cyc_ecf_note:"Km de infraestrutura ciclável por km de estradas principais, segundo a definição da Federação Europeia de Ciclistas. As autoestradas contam como estradas principais, por isso os parques atravessados por autoestradas têm valores mais baixos.",
  d_cyc_na:"A infraestrutura ciclável deste parque ainda não foi medida.",
  m_cyc:"A infraestrutura ciclável segue as definições da <a href='https://european-cyclists-federation.github.io/Documents/Methodology.pdf'>Federação Europeia de Ciclistas (QECIO 2.1)</a>: ciclovias segregadas do trânsito, percursos partilhados por quem pedala e quem caminha, e faixas cicláveis pintadas. Deixamos de fora as marcas de partilha na via, as faixas bus e as faixas cicláveis sugeridas, em que os carros podem circular; a ECF conta estas últimas como faixas cicláveis, e é essa a única diferença face ao seu método. Tal como no método da ECF, a infraestrutura de sentido único conta metade do seu comprimento. Comparamos a infraestrutura ciclável com as estradas, em km por cada 100 km de estrada, nos parques com pelo menos {min} km de estrada. A maioria das ciclovias nos parques não acompanha estradas, por isso um parque pode ter mais km de ciclovia do que de estrada. Zero significa nenhuma mapeada no OpenStreetMap.",

  m_speed_ps:sp=>[
    `A <b>classificação de risco para utilizadores vulneráveis</b> mostra quão perigosos seriam os limites de velocidade afixados de um parque para utilizadores vulneráveis, ou seja, peões e ciclistas, atingidos por um carro. Usa os <b>limites legais de velocidade</b>, da etiqueta maxspeed do OpenStreetMap (as milhas por hora são convertidas), não as velocidades operacionais reais. Muitas estradas não têm nenhum mapeado.`,
    `<b>Que estradas.</b> Todas as estradas estão incluídas, exceto as autoestradas e os seus ramos de acesso (motorway e motorway_link no OpenStreetMap). O <a href="${LINKS.guide}">Guide for Safe Speeds</a> (Banco Mundial e WRI, 2024) define autoestrada como uma via de acesso controlado, sem interseções nem semáforos, onde os utilizadores vulneráveis são proibidos, pelo que não há risco para eles a avaliar. As vias rápidas (trunk) e todas as outras ficam, porque podem ter interseções e passagens. Inferimos o acesso controlado pelo tipo de estrada, sem verificar barreiras no terreno. As autoestradas ficam fora da barra de velocidades e da classificação, e o painel de cada parque indica quantos km são.`,
    `<b>Porquê "utilizadores vulneráveis".</b> O <a href="${LINKS.who}">manual de gestão da velocidade da OMS</a> diz que peões e ciclistas só conseguem tipicamente sobreviver a velocidades de impacto até cerca de 30 km/h, e o Guide for Safe Speeds sugere aplicar a ciclistas e motociclistas os limites que protegem os peões até haver evidência mais específica. Pelo mesmo motivo aplicamos uma só curva de risco a todos os utilizadores vulneráveis: os valores publicados vêm de estudos com peões, o grupo com mais dados, e não existe uma curva publicada separada para ciclistas.`,
    `<b>O valor do risco.</b> Para cada estrada com limite mapeado tomamos o risco de morte de um utilizador vulnerável atingido por um carro a essa velocidade, da meta-análise de 2019 de 20 estudos de <a href="${LINKS.hussain}">Hussain e colegas</a>, que o manual da OMS (2023) cita. Assumimos que o tráfego circula ao limite afixado de cada estrada, lemos o risco nos pontos publicados abaixo e unimos os pontos com retas. Abaixo de 30 km/h usamos 5% e acima de 80 km/h usamos 90%, o valor mais alto publicado, pelo que o risco dos limites mais altos é subestimado. O valor de um parque é a média das suas estradas com limite mapeado, ponderada pela extensão, e a sua posição é entre os parques avaliados.`,
    "RISKTABLE",
    `<b>Faixas de velocidade e "velocidade segura".</b> As faixas da barra (30, 50 e 70 km/h) são as velocidades de impacto sobreviveis do Sistema Seguro, na Tabela 1 do manual da OMS e do Guide for Safe Speeds: 30 km/h onde carros e utilizadores vulneráveis se podem cruzar, 50 km/h onde são possíveis choques laterais, 70 km/h em choques frontais. Uma "velocidade segura" é 30 km/h ou 20 mph ou menos, o que a <a href="${LINKS.stockholm}">Declaração de Estocolmo</a> de 2020 também defende onde utilizadores vulneráveis se misturam com veículos.`,

const state = {lang:"en", region:"all", q:"", sort:"share", selected:HOME, detailView:"square", heroView:"square", showAll:false, group:"all", speed:"all", bikes:"all", dir:-1};
try{ const saved = localStorage.getItem("pc_lang"); if(saved) state.lang = saved; else if((navigator.language||"").toLowerCase().startsWith("pt")) state.lang = "pt"; }catch(e){}

const $ = s => document.querySelector(s);
const t = k => T[state.lang][k];
const L = v => (typeof v === "object" && v !== null) ? v[state.lang] : v;
const num = (n,d=0) => new Intl.NumberFormat(t("locale"),{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const pctFmt = p => new Intl.NumberFormat(t("locale"),{style:"percent",minimumFractionDigits:2,maximumFractionDigits:2}).format(p/100);
const km2Fmt = (m,d=2) => `${num(m/1e6,d)} km²`;

function view(p){
  return {
    pct: p.pct, carM2: p.roadM2 + p.parkingM2, roadKm: p.roadKm,
    cats: CAT_ORDER.map(c => [c, p.split[c]])
  };
}
function drawSquare(el, p, withTag){
  const v = view(p);
  const side = Math.sqrt(v.pct/100) * 100;
  const total = v.cats.reduce((s,[,m]) => s+m, 0) || 1;
  el.innerHTML = `${withTag ? `<span class="sq-tag">${km2Fmt(p.km2*1e6)}</span>` : ""}
    <div class="sq-car" style="width:${side}%;height:${side}%">
      ${v.cats.map(([c,m]) => `<span style="flex:${m/total} 0 0;background:var(${CAT_VAR[c]})"></span>`).join("")}
    </div>`;
  el.setAttribute("role","img");
  el.setAttribute("aria-label", `${L(p.name)}: ${pctFmt(v.pct)}`);
}
const legendHtml = cats => cats.map(([c]) => `<li><i style="background:var(${CAT_VAR[c]})"></i>${t("cat_"+c)}</li>`).join("");

function renderStatic(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if(typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-tp]").forEach(el => { el.placeholder = t(el.dataset.tp); });
  document.querySelectorAll("[data-th]").forEach(el => { const v = t(el.dataset.th); if(typeof v === "string") el.innerHTML = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  const mb = t("m_body").map(x => x.replace("{skipped}", SITE.skipped || 0));
  const R = SITE.rules || {car_low: 1, car_heavy: 4, bikes_share: 50, min_road_km: 5};
  const lo = num(R.car_low, 0), hi = num(R.car_heavy, 0);
  const SP = (R.speed) || {min_cover: 25, min_km: 3, risk_safe_below: 10, risk_unsafe_from: 34, risk_points: []};
  const labelList = `<ul class="labels">
      <li><span class="pill g-free">${t("g_free")}</span>${t("g_free_d")(lo)}</li>
      <li><span class="pill g-some">${t("g_some")}</span>${t("g_some_d")(lo, hi)}</li>
      <li><span class="pill g-heavy">${t("g_heavy")}</span>${t("g_heavy_d")(hi)}</li>
      <li><span class="pill b-share">${t("b_share")}</span>${t("b_share_d")(R.bikes_share)}</li>
      <li><span class="pill b-little">${t("b_little")}</span>${t("b_little_d")(R.bikes_share)}</li>
      <li><span class="pill s-unsafe">${t("sg_unsafe")}</span>${t("sg_unsafe_d")(SP.risk_safe_below, SP.risk_unsafe_from)}</li>
      <li><span class="pill s-mixed">${t("sg_mixed")}</span>${t("sg_mixed_d")(SP.risk_safe_below, SP.risk_unsafe_from)}</li>
      <li><span class="pill s-safe">${t("sg_safe")}</span>${t("sg_safe_d")(SP.risk_safe_below, SP.risk_unsafe_from)}</li>
      <li><span class="pill s-few">${t("sg_few")}</span>${t("sg_few_d")(SP.min_cover, SP.min_km)}</li></ul>`;
  const sections = [
    ["mh_parks", [mb[0], ...(PARKS.some(p => p.added) ? [t("m_added")(PARKS.filter(p => p.added).map(p => L(p.name)).join(", "))] : []), mb[5]]],
    ["mh_roads", [mb[1], mb[2], mb[3]]],
    ["mh_pieces", [t("m_pieces"), mb[4]]],
    ["mh_speed", t("m_speed_ps")(SP).map(x => x === "RISKTABLE" ? `<table class="rt"><thead><tr><th>${t("m_rt_speed")}</th><th>${t("m_rt_risk")}</th></tr></thead><tbody>${(SP.risk_points || []).map(([v, r]) => `<tr><td>${v} km/h</td><td>${r}%</td></tr>`).join("")}</tbody></table>` : x)],
    ...(PARKS.some(p => p.cyc) ? [["mh_cyc", [t("m_cyc").replace("{min}", R.min_road_km)]]] : []),
    ["mh_groups", [t("m_groups_intro"), labelList, t("m_groups_note")]],
    ["mh_limits", [mb[6], t("m_limits_zero")]],
  ];
  renderMenus();
  $("#sortDir").textContent = t(state.dir < 0 ? "sort_desc" : "sort_asc");
  $("#methodBody").innerHTML = sections.map(([h, ps]) =>
    `<h3${h === "mh_speed" ? ' id="m-speed"' : ""}>${t(h)}</h3>` + ps.map(x => x.startsWith("<ul") || x.startsWith("<table") ? x : `<p>${x}</p>`).join("")).join("");
  renderParkList();
  const mons = PARKS.find(p => p.id === HOME);
  const car = mons.roadM2 + mons.parkingM2;
  const rank = [...PARKS].sort((a, b) => b.pct - a.pct).findIndex(p => p.id === HOME) + 1;
  const hi1 = (SITE.rules || {car_heavy: 4}).car_heavy;
  const heavy = PARKS.filter(p => p.pct >= hi1).length;       // the same line as the "Car-heavy" label
  const peers = PARKS.filter(p => p.region === mons.region).sort((a, b) => b.pct - a.pct);
  const regRank = peers.findIndex(p => p.id === HOME) + 1;
  const reg = (peers.length > 3 && regRank <= 3 && t("in_reg")[mons.region]) ? {ord: t("ord")(regRank), n: peers.length, in: t("in_reg")[mons.region]} : null;
  const topOf = p => Math.max(p.max_hw || 0, p.max_road || 0);       // highest mapped speed limit anywhere in the park
  const topSpeed = topOf(mons), nFast = PARKS.filter(p => topOf(p) >= topSpeed).length;

const listSort = {key: "country", dir: 1};
function renderParkList(){
  const keyFn = {
    name: p => L(p.name), country: p => `${L(p.country)} ${L(p.name)}`,
    area: p => p.km2, share: p => p.pct,
  }[listSort.key];
  const rows = [...PARKS].sort((a, b) => {
    const x = keyFn(a), y = keyFn(b);

  });
  const th = (k, label) => `<th data-k="${k}"${listSort.key === k ? ` aria-sort="${listSort.dir > 0 ? "ascending" : "descending"}"` : ""}>${label}</th>`;

const URL_KEYS = {region: "region", group: "car", speed: "speed", bikes: "bikes", q: "q", sort: "sort"};
function writeUrl(){           // the filters live in the page link, so a view can be shared
  try{
    const u = new URL(location.href);
    Object.entries(URL_KEYS).forEach(([k, name]) => { const v = state[k]; if(v && v !== DEFAULTS[k] && !(k === "sort" && v === "share")) u.searchParams.set(name, v); else u.searchParams.delete(name); });
    if(state.dir > 0) u.searchParams.set("dir", "asc"); else u.searchParams.delete("dir");
    history.replaceState(null, "", u);
  }catch(e){}
}
function readUrl(){
  try{
    const q = new URLSearchParams(location.search);
    Object.entries(URL_KEYS).forEach(([k, name]) => { if(q.has(name)) state[k] = q.get(name); });
    if(q.get("dir") === "asc") state.dir = 1;
    if(!REGIONS.includes(state.region)) state.region = "all";
    if(!["all", "free", "some", "heavy"].includes(state.group)) state.group = "all";
    if(!["all", "unsafe", "mixed", "safe", "few"].includes(state.speed)) state.speed = "all";
    if(!["all", "share", "little"].includes(state.bikes)) state.bikes = "all";
    if(!["share", "size", "density", "cycling", "unsafe"].includes(state.sort)) state.sort = "share";

  const labelG = g.append("g");
  const labels = labelG.selectAll("g").data(pieces.filter(f => f.properties.id <= 2 && pieces.length > 1)).join("g").attr("class","plabel");
  labels.append("text").text(d => `${num(d.properties.km2, 2)} km²`);
  const signs = g.append("g").selectAll("g").data(geo.signs || []).join("g").attr("class","sign").style("pointer-events", "none");   // clicks go through to the road under the sign
  signs.append("circle").attr("r", 8.5);
  signs.append("text").attr("dy","0.35em").text(d => d.v);
  signs.append("title").text(d => `${d.v} km/h`);
  const show = (ev, d) => {
    const [x, y] = d3.pointer(ev, box);
    tip.innerHTML = `<b>${t("cx_" + d.t)}</b>${t(d.v === "path" ? "cx_path" : "cx_road")}${d.mw ? t("cx_mwt") : ""}<br>${t("cx_crosses")}: ${roadWords(d.x)}<br>${t("cx_along")}: ${roadWords(d.a)}`;
    tip.style.display = "block";
    tip.style.left = Math.max(4, Math.min(x + 12, box.clientWidth - 250)) + "px";
    tip.style.top = Math.max(y - 10, 4) + "px";
  };
  const cross = g.append("g").selectAll("circle").data(geo.crossings || []).join("circle").attr("r", 5.5)
    .attr("class", d => `cx ${d.t === "unmarked" ? "cx-unmarked" : "cx-" + d.v}${d.mw && d.t !== "unmarked" ? " cx-mw" : ""}`)
    .attr("stroke-width", d => d.mw ? 2.5 : 1.5).attr("tabindex", 0)
    .attr("aria-label", d => `${t("cx_" + d.t)}, ${t("cx_crosses").toLowerCase()} ${d.x}`)
    .on("mouseenter click focus", show).on("mouseleave blur", () => { tip.style.display = "none"; });

  // scale bar (screen space)
  const scaleG = svg.append("g").attr("class","m-scale").attr("transform", `translate(14,${h - 16})`);
  const scaleLine = scaleG.append("line").attr("y1", 0).attr("y2", 0);
  const scaleText = scaleG.append("text").attr("y", -6);

  // basemap button, attribution and note
  const btns = document.createElement("div");
  btns.className = "map-btns";
  if(compact) btns.style.display = "none";
  box.appendChild(btns);
  const hasCyc = !!(geo.cycling && geo.cycling.features.length), hasSpd = !!(park && park.has_spd);
  const mkBtn = (label, enabled) => {         // speed limits, cycling and basemap on every map; a layer with no data is greyed out
    const x = document.createElement("button");
    x.type = "button"; x.className = "bm-btn"; x.textContent = label;
    if(!enabled){ x.disabled = true; x.title = t("layer_none"); }
    btns.appendChild(x); return x;
  };
  const spdBtn = mkBtn(t("spd_btn"), hasSpd), cycBtn = mkBtn(t("cyc_btn"), hasCyc);
  let keyEl = null;
  if(hasSpd && !compact){
    keyEl = box.nextElementSibling && box.nextElementSibling.classList.contains("spdmapkey") ? box.nextElementSibling : null;
    if(!keyEl){ keyEl = document.createElement("div"); keyEl.className = "spdmapkey"; keyEl.hidden = true; box.insertAdjacentElement("afterend", keyEl); }
  }
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "bm-btn"; btn.textContent = t("bm");
  btns.appendChild(btn);
  const attr = document.createElement("div");
  attr.className = "bm-attr"; attr.innerHTML = "© OpenFreeMap © OpenMapTiles © OpenStreetMap contributors";
  box.appendChild(attr);
  let gl = null, glDiv = null, noted = false;
  const blocked = () => {
    if(noted) return; noted = true;
    box.insertAdjacentHTML("beforeend", `<div class="bm-note">${t("bm_blocked")}</div>`);
  };

  let tr = d3.zoomIdentity;
  const at = (x, y) => `translate(${x},${y}) scale(${1 / tr.k})`;
  function view(){        // where MapLibre should look to match the d3 view
    const centre = proj.invert(tr.invert([w / 2, h / 2]));
    const zoom = Math.log2(2 * Math.PI * proj.scale() * tr.k / 512);
    return {center: centre, zoom};
  }
  function syncBasemap(){
    box.classList.toggle("bm-active", basemapOn);
    if(!basemapOn){ if(glDiv) glDiv.style.display = "none"; return; }
    if(glDiv){ glDiv.style.display = ""; if(gl) gl.jumpTo(view()); return; }
    glDiv = document.createElement("div");
    glDiv.className = "bm-gl";
    glDiv.style.height = h + "px";
    box.insertBefore(glDiv, box.querySelector("svg"));
    loadMapLibre().then(ml => {
      gl = new ml.Map({container: glDiv, style: BASEMAP_STYLE, interactive: false,
                       attributionControl: false, fadeDuration: 0, ...view()});
      gl.on("error", blocked);
    }).catch(blocked);
  }
  function refresh(){
    const accepted = [];
    signs.attr("transform", d => at(...proj([d.lon, d.lat])))
      .style("display", d => {
        if(!o.signs) return "none";
        const [x, y] = proj([d.lon, d.lat]);
        const sx = x * tr.k + tr.x, sy = y * tr.k + tr.y;
        if(sx < -10 || sy < -10 || sx > w + 10 || sy > h + 10 || accepted.length >= MAX_SIGNS) return "none";
        for(const [ax, ay] of accepted) if((ax - sx) ** 2 + (ay - sy) ** 2 < SIGN_GAP_PX ** 2) return "none";
        accepted.push([sx, sy]);
        return null;
      });
    cross.attr("transform", d => at(...proj([d.lon, d.lat])))
      .style("display", d => (compact || (d.t === "unmarked" && !o.unmarked)) ? "none" : null);
    labels.attr("transform", d => at(...path.centroid(d)));
    pieceG.style("display", o.pieces ? null : "none");
    labelG.style("display", o.pieces ? null : "none");
    const mpp = mPerPx / tr.k;
    const step = SCALE_STEPS.filter(m => m / mpp <= 110).pop() || SCALE_STEPS[0];
    scaleLine.attr("x2", step / mpp);
    scaleText.text(step >= 1000 ? `${step / 1000} km` : `${step} m`);
    cycG.style("display", cyclingOn ? null : "none");
    cycBtn.setAttribute("aria-pressed", String(cyclingOn && hasCyc)); cycBtn.textContent = t("cyc_btn");
    const spd = speedOn && hasSpd;
    surf.style("opacity", spd ? 0.3 : null);
    spdG.style("display", spd ? null : "none");
    hitCyc.style("display", cyclingOn && hasCyc ? null : "none");
    spdBtn.setAttribute("aria-pressed", String(spd)); spdBtn.textContent = t("spd_btn");
    if(spd) loadSpeedLayer();
    if(keyEl){
      keyEl.hidden = !spd;
      if(spd && keyEl.dataset.lang !== state.lang){ keyEl.innerHTML = speedKeyHtml(park); keyEl.dataset.lang = state.lang; }
    }
    if(!compact){
      resetBtn.hidden = Math.abs(tr.k - 1) < 0.001 && Math.abs(tr.x) < 1 && Math.abs(tr.y) < 1;
    }
    placePop();
    svg.classed("bm-on", basemapOn);
    btn.setAttribute("aria-pressed", String(basemapOn));
    attr.style.display = basemapOn ? "block" : "none";
    syncBasemap();
  }
  btn.onclick = () => { basemapOn = !basemapOn; liveMaps.forEach(m => m.refresh()); };
  if(hasCyc) cycBtn.onclick = () => { cyclingOn = !cyclingOn; liveMaps.forEach(m => m.refresh()); };
  if(hasSpd) spdBtn.onclick = () => { speedOn = !speedOn; liveMaps.forEach(m => m.refresh()); };
  const kMax = Math.max(16, mPerPx * 90 / 20);        // deep enough for a ~20 m scale bar
  const kMin = compact ? 1 : 1 / 32;                   // five levels out, so the park can be seen within its region
  const room = compact ? 0 : Math.max(w, h) * 40;
  const zoomer = d3.zoom().scaleExtent([kMin, kMax]).translateExtent([[-room, -room], [w + room, h + room]]).on("zoom", ev => {
    tr = ev.transform; g.attr("transform", tr); refresh();
  });
  if(o.wheelKey){                                      // hero map: the wheel zooms only with Ctrl or ⌘, and gently (a mouse notch is ~20%; a trackpad pinch keeps its own speed)
    zoomer.filter(ev => (ev.type !== "wheel" || ev.ctrlKey || ev.metaKey) && !ev.button);
    zoomer.wheelDelta(ev => -ev.deltaY * (ev.deltaMode === 1 ? 0.05 : ev.deltaMode ? 1 : 0.002) * (ev.ctrlKey && Math.abs(ev.deltaY) < 50 ? 10 : 1));
  }
  svg.call(zoomer);
  svg.on("click.pop", ev => { if(!ev.target.closest(".hit")) hidePop(); });
  const resetBtn = document.createElement("button");
  resetBtn.type = "button"; resetBtn.className = "m-reset"; resetBtn.textContent = t("reset_view"); resetBtn.hidden = true;
  resetBtn.onclick = () => svg.transition().duration(350).call(zoomer.transform, d3.zoomIdentity);
  if(!compact) box.appendChild(resetBtn);
  loadRoads();
  const handle = { refresh, hidePop, set(u){ Object.assign(o, u); refresh(); },
                   destroy(){ if(gl){ gl.remove(); gl = null; } } };
  liveMaps.forEach(m => { if(!document.body.contains(m.box)){ m.destroy(); liveMaps.delete(m); } });
  handle.box = box;
  liveMaps.add(handle);
  refresh();
  return handle;
}
let storyStarted = false;
function initStoryMap(){
  if(storyStarted) return;
  storyStarted = true;
  getMap(HOME).then(geo => {
    if(!geo) return;
    storyMap = buildMap($("#map"), geo, {pieces: $("#optPieces").checked, signs: $("#optSpeed").checked, unmarked: $("#showUnmarked").checked, id: HOME});
    $("#mapLegend").innerHTML = mapLegendHtml(true, !!PARKS.find(p => p.id === HOME).cyc);
  });
}
$("#optPieces").onchange = e => storyMap && storyMap.set({pieces: e.target.checked});
$("#optSpeed").onchange = e => storyMap && storyMap.set({signs: e.target.checked});
$("#showUnmarked").onchange = e => storyMap && storyMap.set({unmarked: e.target.checked});
$("#monsanto").addEventListener("toggle", () => {
  $("#storyToggle").textContent = $("#monsanto").open ? t("story_close") : t("story_open");
  if($("#monsanto").open) initStoryMap();
});

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  state.lang = b.dataset.lang;
  try{ localStorage.setItem("pc_lang", state.lang); }catch(e){}
  renderStatic(); renderList();
  if(storyGeo) renderStoryNumbers(storyGeo);
  if(storyMap) $("#mapLegend").innerHTML = mapLegendHtml(true, !!PARKS.find(p => p.id === HOME).cyc);
  liveMaps.forEach(m => m.refresh());
});
$("#moreFacts").onclick = e => { const open = $("#facts").classList.toggle("open"); document.body.classList.toggle("facts-open", open); e.target.textContent = t(open ? "less_facts" : "more_facts"); e.target.setAttribute("aria-expanded", String(open)); };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeMenus(); liveMaps.forEach(m => m.hidePop && m.hidePop()); } });
document.addEventListener("click", e => { if(!e.target.closest(".fmenu")) closeMenus(); });
$("#q").oninput = e => { state.q = e.target.value; writeUrl(); renderList(); };
$("#sortDir").onclick = () => { state.dir = -state.dir; writeUrl(); $("#sortDir").textContent = t(state.dir < 0 ? "sort_desc" : "sort_asc"); renderList(); };
$("#sort").onchange = e => { state.sort = e.target.value; writeUrl(); renderList(); };

readUrl();
$("#q").value = state.q || ""; $("#sort").value = state.sort;
renderStatic(); renderList();
getMap(HOME).then(g => { if(g) renderStoryNumbers(g); });
if(location.hash === "#monsanto") $("#monsanto").open = true;
</script>
